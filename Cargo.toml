[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/storage",
    "crates/platform_android",
    "apps/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daymark Contributors"]
license = "MIT"
repository = "https://github.com/blackpirateapps/modern-todo"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.33", features = ["bundled"] }
slint = "1.18"
