name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install Android Platforms & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "platforms;android-30" "build-tools;34.0.0"

      - name: Set up Rust with Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-apk-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-apk-

      - name: Install cargo-apk
        run: |
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk --locked
          fi

      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p apps/android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore
            echo "KEYSTORE_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Generating CI release keystore..."
            keytool -genkeypair -v \
              -keystore apps/android/release.keystore \
              -alias daymark \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass daymark_ci_keystore_pass \
              -keypass daymark_ci_keystore_pass \
              -dname "CN=Daymark, OU=Daymark, O=Daymark, L=City, S=State, C=US"
            echo "KEYSTORE_PASS=daymark_ci_keystore_pass" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: apps/android/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
        run: |
          cargo apk build --package daymark-android --target aarch64-linux-android --release

      - name: Locate and Collect APK
        run: |
          mkdir -p output
          find target/ -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daymark-android-apk
          path: output/*.apk
          if-no-files-found: error
